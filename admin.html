<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07090f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090f'/%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='%238b5cf6' stroke-width='1.5' opacity='.6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='18' fill='%238b5cf6'%3ES%3C/text%3E%3C/svg%3E">
<title>Dashboard · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#07090f;--side:#0a0d15;--card:#0f141e;--in:#0a0e16;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);--fg:#e8ecf3;--fg2:#9aa4b5;--fg3:#5f6979;--v:#8b5cf6;--v2:#b18cff;--c:#5ec8ff;--g:#4ade80;--a:#fbbf24;--r:#f87171;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
svg{flex-shrink:0}
.gate{min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(600px circle at 50% 0%,rgba(139,92,246,.15),transparent 60%)}
.gate form{width:min(100%,380px);background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:30px;display:grid;gap:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.gate .lk{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:var(--v2)}
.gate h1{font-family:var(--mono);font-size:17px}
.gate p{color:var(--fg2);font-size:13px;margin-top:-8px}
.err{color:var(--r);font-size:12px;font-family:var(--mono);min-height:1em}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;padding-right:44px}
.eye-btn{position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--fg3);display:grid;place-items:center;border-radius:0 10px 10px 0;transition:color .2s}
.eye-btn:hover{color:var(--fg2)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100svh}
.side{position:sticky;top:0;height:100svh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
.brand{font-family:var(--mono);font-weight:600;font-size:14px;padding:4px 10px 20px}
.brand b{color:var(--v2)}
.nav{display:grid;gap:2px;overflow-y:auto;flex:1;align-content:start;margin:0 -4px;padding:0 4px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;color:var(--fg2);font-size:14px;font-weight:500;text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.nav button.on{background:rgba(139,92,246,.14);color:#fff}
.nav button.on svg{color:var(--v2)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.side-foot{display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--line)}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--fg3);font-size:13px;text-decoration:none;border:0;background:none;text-align:left}
.side-foot a:hover,.side-foot button:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(7,9,15,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:14px 28px;min-height:66px}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--fg2);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.pill.dirty{color:var(--a);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}.pill.dirty i{background:var(--a)}
.pill.ok{color:var(--g);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.06)}.pill.ok i{background:var(--g)}
.top .acts{margin-left:auto;display:flex;gap:8px}
.tabs{display:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:rgba(255,255,255,.02);color:var(--fg);transition:border-color .2s,background .2s,transform .15s;white-space:nowrap;text-decoration:none}
.b:hover{border-color:rgba(177,140,255,.6)}
.b:active{transform:scale(.97)}
.b.pri{background:linear-gradient(135deg,#7c3aed,#9d6bff);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px rgba(139,92,246,.8)}
.b.pri:hover{filter:brightness(1.1)}
.b.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.b.ic{padding:7px;width:32px;height:32px}
.b.del{color:var(--r);border-color:rgba(248,113,113,.25)}
.b.del:hover{border-color:var(--r);background:rgba(248,113,113,.08)}
.b.ghost{border-color:transparent;background:none}
.b[disabled]{opacity:.3;pointer-events:none}
.view{padding:28px;max-width:980px;width:100%;display:grid;gap:18px;padding-bottom:60px}
.intro{color:var(--fg2);font-size:14px;margin-top:-4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.card>h2{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card>h2 svg{color:var(--v2)}
.card>.d{color:var(--fg3);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
label.f{display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--fg2);min-width:0}
label.f small{color:var(--fg3);font-weight:400;overflow-wrap:anywhere}
input,textarea,select{width:100%;background:var(--in);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;color:var(--fg);font:14px var(--sans);min-width:0;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:90px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--v2);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
input[type=color]{height:42px;padding:4px;cursor:pointer}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--v);flex-shrink:0}
.cnt{font-family:var(--mono);font-size:11px;color:var(--fg3);text-align:right}
.cnt.bad{color:var(--a)}
.hint{font-size:12px;color:var(--fg3)}
.hint code,.d code,.steps code{font-family:var(--mono);background:var(--in);padding:1px 6px;border-radius:5px;color:var(--fg2);overflow-wrap:anywhere}
.list-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-h h2{font-size:14px;font-weight:600}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015);overflow:hidden}
.item[open]{border-color:var(--line2)}
.item>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.item>summary::-webkit-details-marker{display:none}
.item .ti{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ti small{display:block;font-weight:400;color:var(--fg3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.item .n{font-family:var(--mono);font-size:11px;color:var(--fg3);width:18px;text-align:center}
.item .chev{color:var(--fg3);transition:transform .3s var(--ease);display:grid}
.item[open] .chev{transform:rotate(180deg)}
.item .ops{display:flex;gap:2px}
.item .bd{padding:6px 14px 16px}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:34px 20px;text-align:center;color:var(--fg2);display:grid;gap:10px;justify-items:center}
.empty svg{color:var(--v2)}
.imgf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgf .pv{width:96px;height:96px;border-radius:12px;background:var(--in) center/cover no-repeat;border:1px solid var(--line2);display:grid;place-items:center;color:var(--fg3);flex-shrink:0}
.imgf .pv.wide{width:160px;height:90px}
.imgf .pv.tall{width:96px;height:120px}
.imgf .pv.round{border-radius:50%;width:64px;height:64px}
.imgf .pv.has span{display:none}
.imgf .bt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--in);color:var(--fg2);display:grid;place-items:center}
.icons button.on{border-color:var(--v2);color:var(--v2);background:rgba(139,92,246,.14)}
.posts{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015);cursor:pointer;transition:border-color .2s}
.prow:hover{border-color:var(--line2)}
.prow .th{width:72px;height:48px;border-radius:8px;background:var(--in) center/cover;flex-shrink:0;display:grid;place-items:center;color:var(--fg3)}
.prow .mt{flex:1;min-width:0}
.prow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-family:var(--mono);font-size:11px;color:var(--fg3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.st.live{color:var(--g);border-color:rgba(74,222,128,.3)}.st.dr{color:var(--a);border-color:rgba(251,191,36,.3)}
.ed-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border:1px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0;background:#0c111a}
.tb button{min-width:32px;height:30px;padding:0 8px;border-radius:7px;border:1px solid transparent;background:none;color:var(--fg2);font:600 12px var(--mono);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb button:hover{border-color:var(--line2);color:var(--fg)}
.tb .sp{flex:1}
.tb .tg{display:flex;gap:2px;background:var(--in);border-radius:8px;padding:2px}
.tb .tg button.on{background:var(--v);color:#fff}
.rtb{position:sticky;top:66px;z-index:5;align-items:center}
.rtb select{width:auto;padding:5px 8px;font-size:12px;border-radius:7px;height:30px;background:#0a0e16}
.rtb .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.rtb button.on{background:rgba(139,92,246,.18);color:#fff}
.clr{position:relative;min-width:32px;height:30px;display:inline-grid;place-items:center;border-radius:7px;cursor:pointer;font:700 13px var(--mono);color:var(--fg2)}
.clr:hover{background:rgba(255,255,255,.05)}
.clr span{border-bottom:3px solid var(--v2);line-height:1.1}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0}
.rte{min-height:460px;max-height:75vh;overflow-y:auto;background:var(--in);border:1px solid var(--line2);border-radius:0 0 10px 10px;padding:22px 24px;outline:none;font:16px/1.75 var(--sans);color:#d5dbe6}
.rte:focus{border-color:var(--v2)}
.rte{position:relative}.rte.is-empty::before{content:attr(data-ph);color:var(--fg3);position:absolute;left:24px;top:22px;pointer-events:none}
.prose>*+*{margin-top:1em}
.prose h2{font:700 1.55rem/1.25 'Space Grotesk',var(--sans);color:#fff;margin-top:1.6em}
.prose h3{font:600 1.25rem/1.3 'Space Grotesk',var(--sans);color:#fff;margin-top:1.4em}
.prose h4{font-size:1.05rem;color:#fff}
.prose a{color:var(--v2);text-decoration:underline}
.prose ul,.prose ol{padding-left:1.4em}
.prose blockquote{border-left:3px solid var(--v);padding-left:16px;color:var(--fg2);font-style:italic}
.prose pre{background:#05070c;border:1px solid var(--line2);border-radius:10px;padding:14px 16px;font:13px/1.65 var(--mono);white-space:pre-wrap;overflow-x:auto}
.prose code{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
.prose pre code{background:none;padding:0}
.prose img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.prose figure{margin:1.4em 0}.prose figcaption{text-align:center;color:var(--fg3);font-size:13px;margin-top:8px}
.prose hr{border:0;height:1px;background:var(--line2);margin:1.8em 0}
.prose .ff-serif{font-family:'Lora',Georgia,serif}.prose .ff-mono{font-family:var(--mono)}.prose .ff-display{font-family:'Space Grotesk',var(--sans)}.prose .ff-sans{font-family:var(--sans)}
.prose .fs-sm{font-size:.85em}.prose .fs-lg{font-size:1.25em}.prose .fs-xl{font-size:1.6em;line-height:1.3}
.prose .ta-center{text-align:center}.prose .ta-right{text-align:right}
.rte img.sel{outline:3px solid var(--v2);outline-offset:2px}
.mdbox iframe{width:100%;height:680px;border:1px solid var(--line2);border-radius:0 0 10px 10px;background:#07090f;display:block}
.serp{background:#fff;border-radius:12px;padding:16px 18px;color:#202124;font-family:arial,sans-serif;overflow:hidden}
.serp .u{font-size:12px;color:#4d5156;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.serp .t{font-size:19px;color:#1a0dab;margin:4px 0 3px;line-height:1.3}
.serp .ds{font-size:13px;color:#4d5156;line-height:1.5}
.status-box{border-radius:12px;padding:12px 14px;font-size:13px;border:1px solid var(--line2);background:var(--in);color:var(--fg2)}
.status-box.ok{border-color:rgba(74,222,128,.35);color:var(--g)}
.status-box.bad{border-color:rgba(248,113,113,.35);color:var(--r)}
.steps{display:grid;gap:8px;color:var(--fg2);font-size:13px;counter-reset:s}
.steps li{list-style:none;padding-left:30px;position:relative}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:6px;background:rgba(139,92,246,.15);color:var(--v2);font:600 11px var(--mono);display:grid;place-items:center}
.steps a{color:var(--v2);overflow-wrap:anywhere}
.modal{position:fixed;inset:0;z-index:100;background:rgba(3,5,10,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal .box{width:min(100%,420px);background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:26px;display:grid;gap:16px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8)}
.modal h3{font-size:17px}
.prog{display:grid;gap:10px}
.prog div{display:flex;align-items:center;gap:10px;color:var(--fg3);font-size:13px}
.prog div i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:grid;place-items:center}
.prog div.run{color:var(--fg)}.prog div.run i{border-color:var(--v2);border-top-color:transparent;animation:spin .8s linear infinite}
.prog div.done{color:var(--fg2)}.prog div.done i{border-color:var(--g);background:var(--g);color:#07090f}
.prog div.fail{color:var(--r)}.prog div.fail i{border-color:var(--r)}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:#151b28;border:1px solid var(--line2);border-radius:12px;padding:12px 18px;font-size:13px;transition:transform .35s var(--ease);z-index:200;max-width:calc(100% - 32px);box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.toast.on{transform:translate(-50%,0)}
.bar{display:none}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.swb{position:relative;display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:12px;border:1px solid var(--line2);background:var(--in);color:var(--fg2);font:500 13px var(--sans);text-transform:capitalize;cursor:pointer}
.swb i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--a),var(--b))}
.swb.on{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.tgl{position:relative;display:inline-flex;align-items:center;margin-right:6px;cursor:pointer}
.tgl input{position:absolute;opacity:0;width:0;height:0}
.tgl i{width:36px;height:20px;border-radius:999px;background:#2a3040;position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.tgl input:checked+i{background:var(--v)}.tgl input:checked+i::after{transform:translateX(16px)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top-in{padding:12px 16px;min-height:56px}
  .top h1{font-size:16px}
  .top .acts{display:none}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--fg2);font-size:13px;font-weight:500}
  .tabs button.on{background:var(--v);border-color:var(--v);color:#fff}
  .view{padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
  .card{padding:16px}
  .grid{grid-template-columns:1fr}
  input,textarea,select{font-size:16px}
  .bar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,13,21,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .bar .b{flex:1;padding:13px}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  .mdbox iframe{height:540px}
  .rtb{top:96px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.rtb::-webkit-scrollbar{display:none}.rtb>*{flex-shrink:0}
  .rte{padding:16px;min-height:380px;max-height:none}
  .item .bd{padding:6px 12px 14px}
}
@media (max-width:420px){.top .pill span{display:none}.top .pill{padding:6px}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm">
    <div class="lk" data-i="lock" data-s="20"></div>
    <h1>Dashboard login</h1>
    <p>Enter your admin password to edit your site.</p>
    <div class="pw-wrap"><input type="password" id="pw" autocomplete="current-password" placeholder="Password" autofocus><button type="button" class="eye-btn" onclick="togglePw('pw',this)" aria-label="Show password"><svg id="eye-pw" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>

function wire(v){
  v.querySelectorAll('[data-p]').forEach(el=>{
    const ev=el.tagName==='SELECT'||el.type==='date'?'change':'input';
    el.addEventListener(ev,()=>{let val=el.value;
      if(el.type==='number'){val=+val||0;if(/level$/.test(el.dataset.p))val=Math.max(0,Math.min(100,val))}
      if(/rating$/.test(el.dataset.p))val=+val;
      set(C,el.dataset.p,val);save();liveBits(el.dataset.p)});
  });
  v.querySelectorAll('[data-list]').forEach(el=>el.oninput=()=>{set(C,el.dataset.list,el.value.split('\n').map(s=>s.trim()).filter(Boolean));save()});
  v.querySelectorAll('[data-bool]').forEach(el=>el.onchange=()=>{set(C,el.dataset.bool,el.checked);save()});
  v.querySelectorAll('[data-icon]').forEach(w=>w.onclick=e=>{const b=e.target.closest('button');if(!b)return;set(C,w.dataset.icon,b.dataset.v);w.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));save()});
  v.querySelectorAll('details.item').forEach(d=>d.ontoggle=()=>d.open?openSet.add(d.dataset.k):openSet.delete(d.dataset.k));
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.preventDefault();const k=b.dataset.add;C[k].push(BLANKS[k]());openSet.add(k+'.'+(C[k].length-1));save();render();
    setTimeout(()=>{const last=[...document.querySelectorAll('details.item')].pop();if(last){last.scrollIntoView({behavior:'smooth',block:'center'});last.querySelector('input,textarea')?.focus({preventScroll:true})}},60)});
  v.querySelectorAll('[data-mv]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const[k,i,d]=b.dataset.mv.split('.');const a=C[k],x=+i,y=x+ +d;if(y<0||y>=a.length)return;[a[x],a[y]]=[a[y],a[x]];
    const ox=openSet.has(k+'.'+x),oy=openSet.has(k+'.'+y);openSet.delete(k+'.'+x);openSet.delete(k+'.'+y);if(ox)openSet.add(k+'.'+y);if(oy)openSet.add(k+'.'+x);save();render()});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const[k,i]=b.dataset.del.split('.');
    if(b.dataset.ok){C[k].splice(+i,1);openSet.clear();save();render();toast('Deleted')}else{b.dataset.ok=1;b.classList.remove('ic');b.textContent='Delete?';setTimeout(()=>{if(!b.isConnected)return;delete b.dataset.ok;b.classList.add('ic');b.innerHTML=icon('trash',14)},2500)}});
  v.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>pickImage(+b.dataset.max,url=>{set(C,b.dataset.img,url);save();render();toast('Image added')}));
  v.querySelectorAll('[data-imgdel]').forEach(b=>b.onclick=()=>{set(C,b.dataset.imgdel,'');save();render()});
  const ap=v.querySelector('[data-addp]');if(ap)ap.onclick=()=>{C.about.push('');save();render()};
  const pp=v.querySelector('[data-popp]');if(pp)pp.onclick=()=>{C.about.pop();save();render()};
  v.querySelectorAll('[data-cnt]').forEach(c=>liveBits(c.dataset.cnt));
  if(cur==='seo')['ga','gsc','tt'].forEach(validate);
  if(cur==='settings')wireSettings();
  if(cur==='design')wireDesign(v);
  v.querySelectorAll('[data-vup]').forEach(b=>b.onclick=()=>uploadVideo(+b.dataset.vup,b));
  v.querySelectorAll('[data-vdel]').forEach(b=>b.onclick=()=>{const r=C.reviews[+b.dataset.vdel];r.video='';r.poster='';save();render()});
  if(cur==='blog')wireBlog(v);
}
function liveBits(p){
  const c=document.querySelector(`[data-cnt="${p}"]`);if(c){const n=String(get(C,p)||'').length,m=+c.dataset.max;c.textContent=n+' / '+m;c.classList.toggle('bad',n>m)}
  if(p==='seo.title'){const t=$('#serpT');if(t)t.textContent=C.seo.title||'Your site title'}
  if(p==='seo.description'){const t=$('#serpD');if(t)t.textContent=C.seo.description||'Your site description'}
  if(p==='seo.ga_id')validate('ga');if(p==='seo.gsc_meta')validate('gsc');if(p==='seo.tiktok_pixel')validate('tt');
  if(/^blog\.\d+\.body$/.test(p))wordCount();
}
const gaId=()=>(C.seo.ga_id||'').trim().toUpperCase();
const gscCode=()=>{const v=(C.seo.gsc_meta||'').trim();const m=v.match(/content=["']([^"']+)["']/i);return m?m[1]:(/^[\w-]{20,}$/.test(v)?v:'')};
const ttId=()=>{const v=(C.seo.tiktok_pixel||'').trim();const m=v.match(/ttq\.load\(\s*['"]([A-Z0-9]+)['"]/i);return m?m[1].toUpperCase():(/^[A-Z0-9]{10,30}$/i.test(v)?v.toUpperCase():'')};
function validate(k){
  const el=document.querySelector(`[data-valid="${k}"]`);if(!el)return;
  const raw={ga:C.seo.ga_id,gsc:C.seo.gsc_meta,tt:C.seo.tiktok_pixel}[k];
  if(!String(raw||'').trim()){el.textContent='';return}
  const ok={ga:/^G-[A-Z0-9]{4,}$/.test(gaId()),gsc:!!gscCode(),tt:!!ttId()}[k];
  el.style.color=ok?'var(--g)':'var(--a)';
  el.textContent=ok?({ga:'Looks good',gsc:'Code found: '+gscCode().slice(0,14)+'...',tt:'Pixel ID found: '+ttId()}[k]):({ga:'Should look like G-XXXXXXXXXX',gsc:'Paste the whole <meta ...> tag',tt:'Could not find a Pixel ID'}[k]);
}
function pickImage(max,cb){
  const f=$('#fileIn');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;
    if(!/^image\//.test(file.type)){toast('Please choose an image');return}
    const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      const x=cv.getContext('2d');x.fillStyle='#0f141e';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);cb(cv.toDataURL('image/jpeg',.84))};
    img.onerror=()=>toast('Could not read that image');img.src=URL.createObjectURL(file)};
  f.click();
}

  wireRTE(b);
  wordCount();
}

const FF={sans:1,serif:1,display:1,mono:1},FS={sm:'2',md:'3',lg:'5',xl:'6'},FSR={'1':'sm','2':'sm','4':'lg','5':'lg','6':'xl','7':'xl'};
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:|mailto:|tel:|\/|#)/i.test(u)?u:(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(u)?u:'')};
const cssColor=c=>{c=String(c||'').trim();let m;if(/^#[0-9a-f]{3,6}$/i.test(c))return c;if(m=c.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/))return '#'+[m[1],m[2],m[3]].map(x=>(+x).toString(16).padStart(2,'0')).join('');return ''};
function cleanHTML(html){
  const doc=new DOMParser().parseFromString('<div id="r">'+String(html||'')+'</div>','text/html');const root=doc.getElementById('r');
  const KEEP=new Set(['P','H2','H3','H4','STRONG','EM','U','S','A','UL','OL','LI','BLOCKQUOTE','PRE','CODE','IMG','FIGURE','FIGCAPTION','HR','BR','SPAN']);
  const MAP={B:'STRONG',I:'EM',STRIKE:'S',DEL:'S',INS:'U',DIV:'P',H1:'H2',H5:'H4',H6:'H4',SECTION:'P',ARTICLE:'P'};
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','NOSCRIPT','TEMPLATE','META','LINK','TITLE','svg','SVG','FORM','INPUT','BUTTON','SELECT','TEXTAREA']);
  const walk=el=>{[...el.childNodes].forEach(n=>{
    if(n.nodeType===8){n.remove();return}
    if(n.nodeType!==1)return;
    if(DROP.has(n.tagName)){n.remove();return}
    let t=n;const st=n.getAttribute('style')||'';const align=(st.match(/text-align:\s*(center|right|justify)/i)||[])[1];

function md(src){

    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push(`<blockquote><p>${inl(b.join(' '))}</p></blockquote>`);continue}

    if(/^\s*\d+[.)]\s+/.test(l)){const b=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))b.push(`<li>${inl(L[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`);out.push(`<ol>${b.join('')}</ol>`);continue}

  var hw=document.querySelector('header .w'),hb=document.getElementById('hbg');

  }
  function hl(t,qs){var r=esc(t);qs.forEach(function(q){if(q.length<2)return;var e=esc(q),lo=r.toLowerCase(),out='',i=0,j;while((j=lo.indexOf(e,i))>-1){out+=r.slice(i,j)+'<mark>'+r.slice(j,j+e.length)+'</mark>';i=j+e.length}r=out+r.slice(i)});return r}
  var sm=document.getElementById('sm'),inp=document.getElementById('smIn'),box=document.getElementById('smRes');

    hits=qs.length?IDX.filter(function(x){return qs.every(function(w){return x.hay.indexOf(w)>-1})}).slice(0,24):IDX.filter(function(x){return x.g==='Sections'||x.g==='Pages'||x.g==='Articles'}).slice(0,12);

    var g='',out='';hits.forEach(function(x,i){if(x.g!==g){g=x.g;out+='<div class="sm-g">'+g+'</div>'}out+='<a class="sm-r'+(i===0?' on':'')+'" href="'+x.url+'"><b>'+hl(x.t,qs)+'</b>'+(x.sub?'<small>'+hl(x.sub,qs)+'</small>':'')+'</a>'});
    box.innerHTML=out;
  }
  function mark(i){var rs=box.querySelectorAll('.sm-r');if(!rs.length)return;sel=(i+rs.length)%rs.length;rs.forEach(function(r,k){r.classList.toggle('on',k===sel)});rs[sel].scrollIntoView({block:'nearest'})}
  function open(){sm.classList.add('open');document.body.style.overflow='hidden';inp.value='';run();setTimeout(function(){inp.focus()},40)}
  function close(){sm.classList.remove('open');document.body.style.overflow=''}
  var sb=document.getElementById('srchBtn');if(sb)sb.onclick=open;
  document.getElementById('smX').onclick=close;
  sm.onclick=function(e){if(e.target===sm)close()};
  inp.oninput=run;
  inp.onkeydown=function(e){if(e.key==='ArrowDown'){e.preventDefault();mark(sel+1)}else if(e.key==='ArrowUp'){e.preventDefault();mark(sel-1)}else if(e.key==='Enter'){var r=box.querySelectorAll('.sm-r')[sel];if(r)location.href=r.href}};
  addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();sm.classList.contains('open')?close():open()}else if(e.key==='Escape')close()});
  if(/Mac|iPhone|iPad/.test(navigator.platform)){var k=document.querySelector('.srch kbd');if(k)k.textContent='\u2318 K'}
  fetch('/content.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){
    var h=(c.design&&c.design.hide)||{};
    var o=(c.design&&c.design.order&&c.design.order.length)?c.design.order:SEC.concat(['reviews','faq','blog']);
    var links=o.filter(function(id){return SEC.indexOf(id)>-1&&!h[id]}).map(function(id){return '<a href="/#'+id+'">'+id[0].toUpperCase()+id.slice(1)+'</a>'}).join('');
    var rv=h.reviews?'':'<a href="/reviews/">Reviews</a>';
    var bl=h.blog?'':'<a href="/blog/">Blog</a>';
    document.querySelectorAll('nav.dsk').forEach(function(n){n.innerHTML=links+rv+bl});
    document.querySelectorAll('.drw nav').forEach(function(n){
      n.innerHTML=links+rv+bl+'<a class="cta" href="/#contact">hire_me()</a>';
      n.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){var d=document.getElementById('drw');if(d)d.classList.remove('open');if(hb)hb.classList.remove('open')})});
    });
    build(c,h,o);
  }).catch(function(){});
})();
<\/script>

function accentCss(c){const d=c.design||{};let a=ACCENTS[d.accent];if(d.accent==='custom'&&/^#[0-9a-f]{6}$/i.test(d.custom||'')){const n=parseInt(d.custom.slice(1),16),rgb=[(n>>16)&255,(n>>8)&255,n&255];a=[d.custom,'#'+rgb.map(v=>Math.round(v+(255-v)*.35).toString(16).padStart(2,'0')).join('')]}

<a class="back" href="/blog/">${icon('back',15)} All articles</a>
${(b.tags||[]).length?`<div class="tags">${b.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}

${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="${esc(b.title)}">`:''}
<div class="prose">${postBody(b)}</div>

</article>
${more.length?`<section class="sec"><h2>More articles</h2><div class="grid">${more.map(card).join('')}</div></section>`:''}`;
  return shell(c,(preview?'<base target="_blank">':'')+head,body);

/* ===================== GitHub publish ===================== */
async function gh(path,opt={}){
  const repo=LS.get('gh_repo'),tok=LS.get('gh_token');
  if(!repo||!tok)throw new Error('GitHub is not connected yet. Fill in Settings → GitHub connection.');
  let r;try{r=await fetch('https://api.github.com/repos/'+repo+path,{...opt,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}})}catch(e){throw new Error('Could not reach GitHub. Check your internet connection.')}
  if(r.status===401)throw new Error('The token is wrong or expired. Make a new one in Settings.');
  if(r.status===403)throw new Error('The token has no permission. It needs Contents: Read and write on this repo.');
  if(r.status===404)throw new Error('Repository not found, or the token cannot see it. Check Settings (example: sohan-webdev/portfolio).');
  if(r.status===409)throw new Error('The repository is empty. Upload the site files to GitHub first.');
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('GitHub error '+r.status))}
  return r.status===204?null:r.json();
}
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const STEPS=['Connecting to GitHub','Uploading images','Building pages and SEO files','Saving to GitHub'];
function modal(html){$('#modalBox').innerHTML=html;$('#modal').hidden=false;paint($('#modalBox'))}
function progress(i,state){document.querySelectorAll('.prog div').forEach((d,k)=>{d.className=k<i?'done':k===i?state:'';d.querySelector('i').innerHTML=(k<i||(k===i&&state==='done'))?icon('check',11):''})}
let publishing=false;
async function publish(){
  if(publishing)return;
  if(!LS.get('gh_repo')||!LS.get('gh_token')){blogEdit=null;go('settings');toast('Connect GitHub first. It only takes 2 minutes.');return}
  if(C.blog.some(b=>!b.draft&&!String(b.title||'').trim())){toast('A published article has no title. Add one or switch it to draft.');return}
  publishing=true;
  modal(`<h3>Publishing your site</h3><div class="prog">${STEPS.map(s=>`<div><i></i>${s}</div>`).join('')}</div><div id="pubMsg" class="hint"></div>`);
  const br=LS.get('gh_branch')||'main';let step=0;
  try{
    progress(0,'run');
    const ref=await gh('/git/ref/heads/'+encodeURIComponent(br));const head=ref.object.sha;
    const commit=await gh('/git/commits/'+head);const baseTree=commit.tree.sha;
    const tree=await gh('/git/trees/'+baseTree+'?recursive=1');
    const existing=new Set(tree.tree.filter(t=>t.type==='blob').map(t=>t.path));

    step=1;progress(1,'run');
    const out=structuredClone(C);out.blog.forEach(b=>delete b.slug_auto);
    const RX=/data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+/g;
    const found=new Map();
    const scan=o=>{for(const k in o){const v=o[k];if(typeof v==='string'){(v.match(RX)||[]).forEach(u=>found.set(u,null))}else if(v&&typeof v==='object')scan(v)}};scan(out);
    const entries=[];let n=0;
    for(const u of found.keys()){
      const ext=u.slice(11,u.indexOf(';')).replace('jpeg','jpg');const data=u.slice(u.indexOf(',')+1);
      const path='assets/up/'+(await sha(data,'SHA-1')).slice(0,16)+'.'+ext;found.set(u,'/'+path);
      if(!existing.has(path)&&!entries.some(e=>e.path===path)){const bl=await gh('/git/blobs',{method:'POST',body:JSON.stringify({content:data,encoding:'base64'})});entries.push({path,mode:'100644',type:'blob',sha:bl.sha})}
      $('#pubMsg').textContent=(++n)+' of '+found.size+' images';
    }
    const swap=o=>{for(const k in o){const v=o[k];if(typeof v==='string'&&v.includes('data:image/'))o[k]=v.replace(RX,m=>found.get(m)||m);else if(v&&typeof v==='object')swap(v)}};swap(out);
    $('#pubMsg').textContent='';

    step=2;progress(2,'run');
    const site=(out.seo.site_url||location.origin).replace(/\/$/,'');
    const posts=out.blog.filter(b=>!b.draft&&b.title&&b.slug).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const files={};
    files['content.json']=JSON.stringify(out,null,2);
    files['sitemap.xml']=sitemap(site,posts);
    files['robots.txt']=`User-agent: *\nAllow: /\nDisallow: /admin.html\n\nSitemap: ${site}/sitemap.xml\n`;
    if(!out.design?.hide?.blog){files['blog/index.html']=blogIndexHTML(out,posts,site);files['blog/feed.xml']=rss(out,site,posts);posts.forEach(p=>files['blog/'+p.slug+'/index.html']=postHTML(out,p,site,posts))}
    if(!out.design?.hide?.reviews)files['reviews/index.html']=reviewsHTML(out,site);
    const gf=(out.seo.gsc_file||'').trim().split('/').pop();if(/^google[a-z0-9]+\.html$/i.test(gf))files[gf]='google-site-verification: '+gf;
    let warn='';
    try{const idx=await gh('/contents/index.html?ref='+encodeURIComponent(br));const html=b64dec(idx.content);
      if(/<!--SEO:START-->[\s\S]*?<!--SEO:END-->/.test(html)){const nh=html.replace(/<!--SEO:START-->[\s\S]*?<!--SEO:END-->/,()=>'<!--SEO:START-->\n'+homeHead(out,site)+'\n<!--SEO:END-->');if(nh!==html)files['index.html']=nh}
      else warn='Your index.html on GitHub is the old version, so SEO and tracking codes were not added. Upload the new index.html to GitHub once.';
    }catch(e){warn='Could not update index.html: '+e.message}
    for(const [path,content] of Object.entries(files))entries.push({path,mode:'100644',type:'blob',content});
    const refd=files['content.json'];
    for(const p of existing){
      if((p.startsWith('blog/')||p.startsWith('reviews/'))&&!(p in files))entries.push({path:p,mode:'100644',type:'blob',sha:null});
      if(p.startsWith('assets/up/')&&!refd.includes('/'+p))entries.push({path:p,mode:'100644',type:'blob',sha:null});
    }

    step=3;progress(3,'run');
    const nt=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:baseTree,tree:entries})});
    const same=nt.sha===baseTree;
    if(!same){
      const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:'Update site from dashboard',tree:nt.sha,parents:[head]})});
      await gh('/git/refs/heads/'+encodeURIComponent(br),{method:'PATCH',body:JSON.stringify({sha:nc.sha,force:true})});
    }
    progress(4,'done');
    out.blog.forEach((b,i)=>{if(C.blog[i]?.slug_auto)b.slug_auto=true});
    C=out;LS.set('portfolio_draft',JSON.stringify(C));LS.del('adm_dirty');setPill();render();
    modal(`<div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(74,222,128,.12);color:var(--g)" data-i="check" data-s="20"></span><h3>${same?'Already up to date':'Published'}</h3></div>
      <p style="color:var(--fg2)">${same?'Nothing changed since your last publish.':'Your site will show the changes in about 1 minute.'}</p>
      ${warn?`<div class="status-box bad">${esc(warn)}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="b" href="/" target="_blank" rel="noopener"><span data-i="external" data-s="15"></span>Open site</a><button class="b pri" id="mClose">Done</button></div>`);
    $('#mClose').onclick=()=>$('#modal').hidden=true;
  }catch(e){
    progress(step,'fail');$('#pubMsg').textContent='';
    $('#modalBox').insertAdjacentHTML('beforeend',`<div class="status-box bad">${esc(e.message)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" id="mSet">Open settings</button><button class="b pri" id="mClose">Close</button></div>`);
    $('#mClose').onclick=()=>$('#modal').hidden=true;$('#mSet').onclick=()=>{$('#modal').hidden=true;blogEdit=null;go('settings')};
  }finally{publishing=false}
}
$('#publishBtn').onclick=$('#publishBtn2').onclick=publish;

paint();
try{if(sessionStorage.getItem('adm')==='1')unlock()}catch(e){}
</script>
</body>
</html>
