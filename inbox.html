<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chat Inbox</title>
<style>
:root{--bg:#0f0c1d;--panel:#1a1630;--line:rgba(255,255,255,.08);--txt:#ece9f7;--mut:rgba(255,255,255,.5);--acc:#8B5CF6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100vh;overflow:hidden}
#login{display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
input,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
button{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
#app{display:none;height:100vh;grid-template-columns:320px 1fr}
#list{border-right:1px solid var(--line);overflow-y:auto}
#list h2{font-size:15px;padding:16px;border-bottom:1px solid var(--line)}
.s{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.s:hover,.s.on{background:rgba(139,92,246,.12)}
.s b{display:block;font-size:14px}.s small{color:var(--mut);font-size:12px}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(139,92,246,.2);color:#c4b5fd;margin-left:6px}
.tag.new{background:#ef4444;color:#fff}
#chat{display:flex;flex-direction:column;height:100vh}
#head{padding:14px 18px;border-bottom:1px solid var(--line)}
#head small{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m.user{background:rgba(255,255,255,.07);align-self:flex-start}
.m.ai{background:rgba(139,92,246,.12);align-self:flex-start;border:1px dashed rgba(139,92,246,.3)}
.m.owner{background:var(--acc);align-self:flex-end}
.m img{max-width:220px;border-radius:10px;display:block;margin-top:6px}
.m .t{display:block;font-size:10px;opacity:.55;margin-top:4px}
#box{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
#box textarea{flex:1;resize:none;height:46px}
#empty{margin:auto;color:var(--mut)}
@media(max-width:760px){#app{grid-template-columns:1fr}#list{display:block}#app.open #list{display:none}#app:not(.open) #chat{display:none}#back{display:inline-block!important}}
#back{display:none;background:none;padding:0 10px 0 0;font-size:18px}
</style>
</head>
<body>
<div id="login">
  <h2>Chat Inbox</h2>
  <input id="pw" type="password" placeholder="Admin password">
  <button id="go">Open inbox</button>
  <p id="err" style="color:#f87171;font-size:13px"></p>
</div>
<div id="app">
  <div id="list"><h2>Conversations</h2><div id="sessions"></div></div>
  <div id="chat">
    <div id="head"><button id="back">&#8592;</button><b id="hn">Select a conversation</b><br><small id="hs"></small></div>
    <div id="msgs"><p id="empty">No conversation selected</p></div>
    <div id="box"><textarea id="txt" placeholder="Write a reply… (Enter to send)"></textarea><button id="send">Send</button></div>
  </div>
</div>
<script>
var PASS = sessionStorage.getItem('inbox_pass') || '';
var current = null;
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(q, opts){
  opts = opts || {};
  return fetch('/reply' + q, { method: opts.method || 'GET', headers: { 'Content-Type': 'application/json', 'x-admin-pass': PASS }, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){ if (r.status === 401) throw new Error('Wrong password or env vars missing'); return r.json(); });
}
function loadSessions(){
  return api('').then(function(d){
    document.getElementById('sessions').innerHTML = (d.sessions||[]).map(function(s){
      return '<div class="s' + (current===s.id?' on':'') + '" data-id="' + esc(s.id) + '" data-n="' + esc(s.visitor_name) + '" data-e="' + esc(s.visitor_email) + '">' +
        '<b>' + esc(s.visitor_name || 'Visitor') + '<span class="tag' + (s.status==='new'?' new':'') + '">' + esc(s.mode==='contact'?'direct':s.mode) + '</span></b>' +
        '<small>' + esc(s.visitor_email || '') + ' · ' + new Date(s.created_at).toLocaleString() + '</small></div>';
    }).join('') || '<p style="padding:16px;color:var(--mut)">No chats yet</p>';
    document.querySelectorAll('.s').forEach(function(el){ el.onclick = function(){ openSession(el.dataset.id, el.dataset.n, el.dataset.e); }; });
  });
}
function openSession(id, n, e){
  current = id;
  document.getElementById('app').classList.add('open');
  document.getElementById('hn').textContent = n || 'Visitor';
  document.getElementById('hs').textContent = e || '';
  loadMsgs(); loadSessions();
}
function loadMsgs(){
  if (!current) return;
  api('?session=' + encodeURIComponent(current)).then(function(d){
    var box = document.getElementById('msgs');
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = (d.messages||[]).map(function(m){
      return '<div class="m ' + esc(m.role) + '">' + esc(m.content) + (m.image_url?'<img src="'+esc(m.image_url)+'">':'') +
        '<span class="t">' + (m.role==='ai'?'AI · ':m.role==='owner'?'You · ':'') + new Date(m.created_at).toLocaleString() + '</span></div>';
    }).join('') || '<p id="empty">No messages</p>';
    if (atBottom) box.scrollTop = box.scrollHeight;
  });
}
function send(){
  var t = document.getElementById('txt'); var v = t.value.trim();
  if (!v || !current) return;
  t.value = '';
  api('', { method:'POST', body:{ session_id: current, text: v } }).then(function(){ loadMsgs(); setTimeout(function(){ var b=document.getElementById('msgs'); b.scrollTop=b.scrollHeight; },300); });
}
function start(){
  api('').then(function(){
    sessionStorage.setItem('inbox_pass', PASS);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    loadSessions();
    setInterval(function(){ loadSessions(); loadMsgs(); }, 8000);
  }).catch(function(e){ document.getElementById('err').textContent = e.message; });
}
document.getElementById('go').onclick = function(){ PASS = document.getElementById('pw').value; start(); };
document.getElementById('pw').onkeydown = function(e){ if (e.key==='Enter') document.getElementById('go').click(); };
document.getElementById('send').onclick = send;
document.getElementById('txt').onkeydown = function(e){ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
document.getElementById('back').onclick = function(){ document.getElementById('app').classList.remove('open'); };
if (PASS) start();
</script>
</body>
</html>
